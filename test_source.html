<!DOCTYPE html>
<html>
<head>
    <title>Test Source Create</title>
</head>
<body>
    <h1>Test Source Creation</h1>
    <button onclick="testLogin()">1. Login</button>
    <button onclick="testCreateSource()">2. Create Source</button>
    <pre id="output"></pre>

    <script>
        let token = '';
        const API_URL = 'http://localhost:8080/api/v1';

        function log(msg) {
            document.getElementById('output').innerHTML += msg + '\n';
        }

        async function testLogin() {
            try {
                const res = await fetch('http://localhost:8001/api/v1/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'password123'
                    })
                });
                const data = await res.json();
                token = data.data.access_token;
                log('✅ Login successful');
                log('Token: ' + token.substring(0, 50) + '...');
            } catch(e) {
                log('❌ Login failed: ' + e.message);
            }
        }

        async function testCreateSource() {
            if (!token) {
                log('❌ Please login first');
                return;
            }
            try {
                // Get user info to get project ID
                const meRes = await fetch('http://localhost:8001/api/v1/auth/me', {
                    headers: {'Authorization': 'Bearer ' + token}
                });
                const meData = await meRes.json();
                const userId = meData.data.id;
                log('User ID: ' + userId);

                const res = await fetch('http://localhost:8002/api/v1/content/sources', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token,
                        'X-Project-ID': userId
                    },
                    body: JSON.stringify({
                        project_id: userId,
                        name: 'Test RSS',
                        source_type: 'rss',
                        url: 'https://habr.com/ru/rss/articles/all/',
                        fetch_interval_minutes: 30
                    })
                });
                const data = await res.json();
                log('✅ Source created: ' + JSON.stringify(data, null, 2));
            } catch(e) {
                log('❌ Create failed: ' + e.message);
            }
        }
    </script>
</body>
</html>
